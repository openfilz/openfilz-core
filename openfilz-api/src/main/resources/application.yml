# src/main/resources/application.yml
spring:
  application:
    name: openfilz-api
  threads:
    virtual:
      enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: false
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dms_db}
    username: ${DB_USER:dms_user}
    password: ${DB_PASSWORD:dms_password}
    initialization-mode: always
    pool:
      enabled: true
      initial-size: 5
      max-size: 10
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:dms_db}
    user: ${DB_USER:dms_user}
    password: ${DB_PASSWORD:dms_password}
    locations: classpath:db/migration
    baseline-on-migrate: true
    out-of-order: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_REALM_URL:http://localhost:8180/realms/openfilz}/protocol/openid-connect/certs

  sql:
    init:
      mode: always

  # SMTP for e-Sign e-mails (invitations, reminders, OTP, completed document). Leave host empty to
  # disable mail: signing links are then only logged (dev / evaluation).
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:true}
          starttls:
            enable: ${SMTP_STARTTLS:true}

  graphql:
    graphiql:
      enabled: true
    http:
      path: /graphql/v1

# Storage Configuration
storage:
  type: local # local or minio
  local:
    base-path: /tmp/dms-storage
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:dms-bucket}
    versioning-enabled: false

# Swagger / OpenAPI
openapi:
  service:
    title: openfilz-api
    url: ${API_ROOT_URL:http://localhost:8081/}
    version: 1.0.0

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logging for auditing (can be more sophisticated)
logging:
  level:
    org.openfilz: DEBUG
    io.r2dbc.postgresql.QUERY: DEBUG # for queries
    org.apache.pdfbox: ERROR
    org.apache.pdfbox.contentstream.PDFStreamEngine: OFF  # Suppress non-critical "Operator rg has too few operands" from Gotenberg-converted PDFs
    org.apache.fontbox: ERROR
    # io.r2dbc.postgresql.PARAM: DEBUG # for parameters
    # org.springframework.security: TRACE

server:
  port: 8081
  http2:
    enabled: false

# Buffer size for PipedInputStreams
piped:
  buffer:
    size: 8192

openfilz:
  common:
    # URL that OnlyOffice DocumentServer uses to reach OpenFilz API
    # Use host.docker.internal when OnlyOffice run in Docker and OpenFilz runs on host
    api-internal-base-url: ${OPENFILZ_INTERNAL_API_BASE_URL:http://host.docker.internal:8081}
    api-public-base-url: ${OPENFILZ_PUBLIC_API_BASE_URL:http://localhost:8081}
    # Public URL of the web app — used to build the signing links sent by e-mail (e-Sign)
    web-public-base-url: ${OPENFILZ_WEB_PUBLIC_BASE_URL:http://localhost:4200/}

  # e-Sign (electronic signature) — see docs/esign.md
  signature:
    active: ${OPENFILZ_SIGNATURE_ACTIVE:false}   # runtime toggle: menus, endpoints, sweeper
    default-expiry-days: ${OPENFILZ_SIGNATURE_DEFAULT_EXPIRY_DAYS:30}
    web-base-url: ${OPENFILZ_SIGNATURE_WEB_BASE_URL:}   # overrides openfilz.common.web-public-base-url
    sweep:
      cron: "0 */5 * * * ?"
    otp:
      length: 6
      valid-minutes: 10
      max-attempts: 5
    seal:
      # self-signed-dev (default, ephemeral cert) | pkcs12 (your own .p12) | openfilz-cloud (sign.openfilz.com, API key)
      provider: ${OPENFILZ_SIGNATURE_SEAL_PROVIDER:self-signed-dev}
      keystore-path: ${OPENFILZ_SIGNATURE_SEAL_KEYSTORE_PATH:}
      keystore-password: ${OPENFILZ_SIGNATURE_SEAL_KEYSTORE_PASSWORD:}
      keystore-alias: ${OPENFILZ_SIGNATURE_SEAL_KEYSTORE_ALIAS:openfilz-seal}
      cloud:
        url: ${OPENFILZ_SIGNATURE_CLOUD_URL:https://sign.openfilz.com}
        api-key: ${OPENFILZ_SIGNATURE_CLOUD_API_KEY:}
    mail:
      from: ${OPENFILZ_SIGNATURE_MAIL_FROM:no-reply@openfilz.com}
      from-name: ${OPENFILZ_SIGNATURE_MAIL_FROM_NAME:OpenFilz e-Sign}
      product-name: ${OPENFILZ_SIGNATURE_PRODUCT_NAME:OpenFilz}
      logo-url: ${OPENFILZ_SIGNATURE_LOGO_URL:}

  # Quota Configuration
  quota:
    # Maximum file size for each uploaded file in megabytes (MB)
    # 0 = no limit (default), > 0 = max file size in MB per file
    file-upload: ${OPENFILZ_QUOTA_FILE_UPLOAD:0}
    # Maximum total storage quota per user in megabytes (MB)
    # 0 = no limit (default), > 0 = max total storage in MB per user
    user: ${OPENFILZ_QUOTA_USER:0}

  # AI Document Chat Configuration
  ai:
    active: false  # Set to true to enable AI chat features
    # Provider switches — translated into spring.ai.model.chat / spring.ai.model.embedding
    # (see AiModelProviderEnvironmentPostProcessor). Ollama wins when both are enabled.
    ollama:
      chat:
        enabled: ${OLLAMA_CHAT_ENABLED:false}
      embedding:
        enabled: ${OLLAMA_EMBEDDING_ENABLED:false}
    openai:
      chat:
        enabled: ${OPENAI_CHAT_ENABLED:false}
      embedding:
        enabled: ${OPENAI_EMBEDDING_ENABLED:false}
    anthropic:
      chat:
        enabled: ${ANTHROPIC_CHAT_ENABLED:false}  # chat only — Anthropic has no embeddings API
    google:
      chat:
        enabled: ${GOOGLE_CHAT_ENABLED:false}     # chat only — embeddings stay on Ollama/OpenAI (768-dim pgvector)
    # Automatic failover when the active chat model refuses to answer — an exhausted free-tier
    # quota, a retired model, or a provider that is down.
    # A provider named in the chain needs no <PROVIDER>_CHAT_ENABLED switch: the chain builds its
    # clients directly. When no switch is set, the chain's FIRST entry also names the primary chat
    # provider, so AI_FALLBACK_CHAIN alone is enough to configure chat.
    # Ignored entirely when the chat provider is Ollama — a local model is deployed to keep
    # document content in-house, and failing over would send RAG context to a third-party API. The request is retried on the next
    # model in the chain, and the failed one is benched for a cooldown so later requests skip it
    # instead of each paying the same failing call. Credential failures never fail over.
    # Chain entries are 'provider:model', tried in order; each provider needs its API key set.
    #   AI_FALLBACK_CHAIN=google:gemini-3.6-flash,anthropic:claude-haiku-4-5,openai:gpt-4o-mini
    fallback:
      enabled: ${AI_FALLBACK_ENABLED:false}
      chain: ${AI_FALLBACK_CHAIN:}
      # Extra API keys per provider, comma-separated and tried in order. Quota is charged per
      # KEY, so once every chain model of a provider is spent on the key in use, the next key of
      # that provider takes over and those models are available again. A provider left empty here
      # keeps using its single spring.ai.*.api-key.
      #   AI_FALLBACK_KEYS_GOOGLE=AIza-first,AIza-second
      keys:
        google: ${AI_FALLBACK_KEYS_GOOGLE:}
        anthropic: ${AI_FALLBACK_KEYS_ANTHROPIC:}
        openai: ${AI_FALLBACK_KEYS_OPENAI:}
        openai-compatible: ${AI_FALLBACK_KEYS_OPENAI_COMPATIBLE:}
      # FAIL_FAST (default) refuses to start when the chain names a provider with no API key —
      # the alternative is discovering it on the day the primary runs out of quota. WARN starts
      # anyway with a shorter chain.
      validation: ${AI_FALLBACK_VALIDATION:FAIL_FAST}
      quota-cooldown: ${AI_FALLBACK_QUOTA_COOLDOWN:5m}
      unavailable-cooldown: ${AI_FALLBACK_UNAVAILABLE_COOLDOWN:6h}
    # BYOK: users may override the chat LLM with their own provider + API key (personal settings).
    # Requires an encryption key for the stored API keys: openssl rand -base64 32
    user-settings:
      enabled: ${AI_USER_SETTINGS_ENABLED:false}
      encryption-key: ${AI_SETTINGS_ENCRYPTION_KEY:}
    system-prompt: |
      You are OpenFilz AI Assistant, a helpful document management assistant.
      You help users find, organize, and understand their documents stored in OpenFilz.

      IMPORTANT RULES:
      1. You have tools. Call them directly — NEVER describe what you would call or show JSON.
      2. Use queryDocuments for ALL document searches: list folder contents, search by name, find recent files, count documents. Examples:
         - "latest file" → queryDocuments(folder="all", sortBy="createdAt", sortOrder="DESC", pageSize=1)
         - "list AI-tests" → queryDocuments(folder="AI-tests")
         - "search for CV" → queryDocuments(folder="all", nameLike="CV")
         - "count files" → queryDocuments(folder=null, type="FILE", countOnly=true)
      3. When asked to summarize or read a document, first use queryDocuments to find it, then readDocumentContent with the exact filename and folder.
      4. Present results clearly. Use document names, not IDs.
      5. Default target folder is root (null) for moves and file creation.
      6. Only ask for confirmation on destructive actions (delete, rename). Act immediately on reads.
      7. When RAG context is provided, USE IT and mention the document name.
      8. You can analyze images and PDFs. When a user asks about an image file or wants to extract text from an image or scanned PDF, use the describeImage tool with the appropriate task ('describe', 'ocr', or 'answer').
    embedding:
      chunk-size: 1000       # Characters per text chunk
      chunk-overlap: 200     # Overlap between chunks
      top-k: 5               # Number of similar chunks to retrieve
      similarity-threshold: 0.3  # Minimum similarity score (0.0 - 1.0) — lower = more results, higher = stricter match
      # The embedding model is a one-time deployment decision: changing it invalidates every vector
      # already stored in vector_store (see EmbeddingRegistryGuard). fail-fast (default) refuses to
      # start on a mismatch while indexed vectors exist; warn starts anyway with degraded RAG results.
      validation: ${OPENFILZ_AI_EMBEDDING_VALIDATION:fail-fast}

  calculate-checksum: false
  #  calculate-checksum: default false - if true : calculate checksum of each new or modified file

  # TUS Protocol Configuration (Resumable Uploads)
  # Enables chunked uploads to bypass Cloudflare's 100MB limit
  tus:
    enabled: ${TUS_ENABLED:true}
    # Temporary storage path for TUS uploads in progress
    temp-storage-path: ${TUS_TEMP_STORAGE:/tmp/tus-uploads}
    # Maximum upload size in bytes (default: 10GB)
    max-upload-size: ${TUS_MAX_UPLOAD_SIZE:10737418240}
    # Recommended chunk size in bytes (default: 50MB - safely under Cloudflare's 100MB limit)
    chunk-size: ${TUS_CHUNK_SIZE:52428800}
    # Upload expiration period in milliseconds (default: 24 hours)
    upload-expiration-period: ${TUS_UPLOAD_EXPIRATION:86400000}
    # Cleanup interval for expired uploads in milliseconds (default: 1 hour)
    cleanup-interval: ${TUS_CLEANUP_INTERVAL:3600000}

  security:
    no-auth: true # No authentication required
    worm-mode: false # if true : only read-only endPoints (for list, query and download) and upload (and upload-multiple) endPoints are accessible
    custom-roles: false # if true : you can provide a custom implementation of org.openfilz.dms.config.DefaultAuthSecurityConfig and org.openfilz.dms.security.impl.SecurityServiceImpl
    cors-allowed-origins: http://localhost:4200/ # Comma-separated list of authorized origins
    role-token-lookup: REALM_ACCESS # GROUPS or REALM_ACCESS (default value) : optional value used in org.openfilz.dms.security.impl.AbstractSecurityService to retrieve Role information from Groups or from the Realm_access
    root-group: OPENFILZ # when role-token-lookup is GROUP, name of the root group holding the 3 Roles as subgroups : eg. 'OPENFILZ' is the root group in the group /OPENFILZ/AUDITORS

  full-text:
    active: false
    default-index: openfilz
    content-languages: fr,en # Stemmer languages for content analysis (e.g. fr,en,de,es,it,nl,pt,ar)
    indexation-mode: local # local (only choice for the moment) -> to be developed : redis | kafka | nats
    opensearch:
      host: localhost
      port: 9200
      scheme: https
      username: admin
      password: yourStrongPassword123!
  audit:
    excluded-actions: [] # Actions to exclude from auditing, e.g. [DOWNLOAD_DOCUMENT, COPY_FILE]
    chain:
      enabled: true
      algorithm: SHA-256
      verification-cron: "0 0 3 * * ?"
      verification-enabled: true
  soft-delete:
    active: false
    # Properties below soft-delete.recycle-bin are used only when soft-delete.active is true
    recycle-bin:
      enabled: true # Enable recycle bin functionality (soft delete)
      auto-cleanup-interval: "30 days" # Number of days before automatically deleting items from recycle bin (0 = never auto-delete)
      cleanup-cron: "0 0 2 * * ?" # Cron expression for cleanup job (daily at 2 AM)
  # Thumbnail Generation Configuration
  thumbnail:
    active: false  # Feature toggle - set to true to enable thumbnail generation
    gotenberg:
      url: ${GOTENBERG_URL:http://localhost:8083}  # Gotenberg service URL (for PDFs and Office docs)
      timeout-seconds: 60  # Timeout for document conversion
    storage:
      use-main-storage: true  # true: storage type follows storage.type; false: uses type below
      type: local  # Storage type for thumbnails when use-main-storage=false (local or minio)
      local:
        base-path: ${THUMBNAIL_STORAGE_BASE_PATH:/tmp/dms-thumbnails}
      minio:
        bucket-name: ${THUMBNAIL_BUCKET_NAME:dms-thumbnails}
    pdf-max-size-bytes: ${THUMBNAIL_PDF_MAX_SIZE_BYTES:104857600}  # 100 MB - PDFs larger than this skip thumbnail rendering to avoid OOM
    dimensions:
      width: 100
      height: 100

# OnlyOffice DocumentServer Integration
onlyoffice:
  enabled: ${ONLYOFFICE_ENABLED:false}
  document-server:
    url: ${ONLYOFFICE_URL:http://localhost}
    api-path: /web-apps/apps/api/documents/api.js
  jwt:
    enabled: true
    secret: ${ONLYOFFICE_JWT_SECRET:openfilz-onlyoffice-jwt-secret-2024}
  supported-extensions:
    - docx
    - doc
    - xlsx
    - xls
    - pptx
    - ppt
    - odt
    - ods
    - odp
    - pdf

# ============================================================
# Spring AI Configuration (only used when openfilz.ai.active=true)
# ============================================================
# Which provider serves chat / embeddings is driven by the openfilz.ai.<provider>.<kind>.enabled
# switches below: AiModelProviderEnvironmentPostProcessor turns them into Spring AI 2.0's
# spring.ai.model.chat / spring.ai.model.embedding selectors (Ollama wins if both are enabled,
# 'none' if neither is). Set spring.ai.model.* explicitly to bypass that mapping.
# The chat model can be swapped freely; the EMBEDDING model is a one-time deployment decision —
# changing it invalidates every stored vector (see EmbeddingRegistryGuard and
# openfilz.ai.embedding.validation above).

# Ollama (default for local development)
spring.ai.ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat:
    model: ${OLLAMA_CHAT_MODEL:qwen2.5}
  embedding:
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

# OpenAI-compatible API (for cloud providers: OpenAI, Anthropic via proxy, etc.)
# Note: api-key defaults to 'disabled' (not empty) to prevent OpenAI auto-configuration
# from failing at startup. When actually using OpenAI, set OPENAI_API_KEY to your real key.
spring.ai.openai:
  api-key: ${OPENAI_API_KEY:disabled}
  base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  chat:
    model: ${OPENAI_CHAT_MODEL:${openfilz-internal.ai.chat-model.openai:gpt-4o}}
  embedding:
    model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
    # vector_store's embedding column is fixed at vector(768), so ask OpenAI to shorten its
    # vectors to 768 (text-embedding-3-* support native dimension shortening; default is 1536).
    dimensions: ${OPENAI_EMBEDDING_DIMENSIONS:768}

# Anthropic Claude (activated via ANTHROPIC_CHAT_ENABLED=true; key from platform.claude.com)
spring.ai.anthropic:
  api-key: ${ANTHROPIC_API_KEY:disabled}
  chat:
    model: ${ANTHROPIC_CHAT_MODEL:${openfilz-internal.ai.chat-model.anthropic:claude-opus-5}}

# Google Gemini — GenAI / Gemini Developer API (activated via GOOGLE_CHAT_ENABLED=true;
# free-tier key from aistudio.google.com)
spring.ai.google.genai:
  api-key: ${GOOGLE_API_KEY:disabled}
  chat:
    model: ${GOOGLE_CHAT_MODEL:${openfilz-internal.ai.chat-model.google-genai:gemini-3.6-flash}}

# PgVector Store (auto-configured when spring-ai-starter-vector-store-pgvector is on classpath)
spring.ai.vectorstore.pgvector:
  index-type: hnsw
  distance-type: cosine_distance
  dimensions: 768
  initialize-schema: false  # We manage schema with Flyway

# Database schema initialization (e.g., Flyway or Liquibase if preferred)
# For simple R2DBC, you might use an InitializingBean to create tables
# Example:
# spring.sql.init.mode=always
# spring.sql.init.schema-locations=classpath:schema.sql
