{{- if not .Values.global.db.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
  labels:
    {{- include "openfilz-ce.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ required "Set db.password (or global.db.existingSecret)" .Values.db.password | quote }}
{{- end }}
