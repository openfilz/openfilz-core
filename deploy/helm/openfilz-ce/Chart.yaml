apiVersion: v2
name: openfilz-ce
description: >-
  OpenFilz Community Edition stack for one namespace — the openfilz-api and
  openfilz-web component charts plus a single-node PostgreSQL, an optional
  pg_dump backup CronJob and namespace NetworkPolicies. Shared services
  (Keycloak, Gotenberg, OpenSearch, OnlyOffice) are consumed from an
  openfilz-shared release via values.
type: application
version: 0.2.0
appVersion: "latest"
keywords:
  - openfilz
  - dms
home: https://openfilz.com
sources:
  - https://github.com/openfilz/openfilz-core
dependencies:
  - name: openfilz-api
    version: "1.1.0"
    repository: file://../openfilz-api
  - name: openfilz-web
    version: "1.1.0"
    repository: file://../openfilz-web
