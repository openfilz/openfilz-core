# Default values for the openfilz-web chart.
#
# The container generates ngx-env.js at startup from the NG_APP_* environment
# variables (same mechanism as the dokploy compose deployment).
#
# The chart works standalone and as a subchart of the openfilz-ce umbrella
# chart. Cross-cutting settings can come from the `global:` block (set by the
# umbrella); every global key has a chart-local equivalent that wins when set.

# Shared values injected by the openfilz-ce umbrella chart — leave empty for a
# standalone install (set the chart-local keys instead).
global: {}
  # imageTag: ""             # pin one image tag for every OpenFilz subchart
  # hosts: { web: "", api: "" }
  # ingress: { enabled: true, className: "", tlsSecretName: "" }
  # auth: { enabled: true, publicAuthority: "", clientId: "" }
  # onlyoffice: { enabled: false, publicUrl: "" }
  # nodeSelector: {}
  # tolerations: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  registry: ghcr.io
  repository: openfilz/openfilz-web
  tag: ""                    # default: global.imageTag, then the chart appVersion
  pullPolicy: Always
  pullSecrets: []

# Public hostnames (no scheme). Fall back to global.hosts.* when empty.
hosts:
  web: ""
  api: ""

app:
  # Default: https://<hosts.api>/api/v1 and /graphql/v1. Override for http or
  # non-443 ports (e.g. kind / port-forward setups).
  apiUrl: ""
  graphQlUrl: ""

auth:
  # null → global.auth.enabled → true
  enabled: null
  # Browser-facing issuer (must match the token `iss` claim),
  # e.g. https://auth.example.com/realms/openfilz
  publicAuthority: ""        # → global.auth.publicAuthority
  clientId: ""               # → global.auth.clientId → openfilz-web

onlyoffice:
  # null → global.onlyoffice.enabled → false
  enabled: null
  publicUrl: ""              # → global.onlyoffice.publicUrl

# Extra NG_APP_* (or other) environment variables injected via a
# chart-managed ConfigMap (envFrom).
extraEnv: {}

service:
  type: ClusterIP
  port: 8080

ingress:
  # null → global.ingress.enabled → true
  enabled: null
  className: ""              # → global.ingress.className
  tlsSecretName: ""          # → global.ingress.tlsSecretName; empty = no TLS block
  annotations: {}
  path: /

# OpenShift: use a Route instead of an Ingress.
openshift:
  enabled: false
  route:
    enabled: false
    hostname: ""             # default: hosts.web (empty = OpenShift generates one)
    tls:
      enabled: true
      termination: "edge"
      insecureEdgeTerminationPolicy: "Redirect"
      # Do not commit plain-text keys/certs — use --set or helm secrets.
      key: ""
      certificate: ""
      caCertificate: ""
      destinationCACertificate: ""

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 128Mi }

nodeSelector: {}             # → global.nodeSelector
tolerations: []              # → global.tolerations
