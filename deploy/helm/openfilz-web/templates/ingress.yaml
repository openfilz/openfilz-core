{{- if and (eq (include "openfilz-web.ingressEnabled" .) "true") (not .Values.openshift.enabled) }}
{{- $host := include "openfilz-web.hostWeb" . }}
{{- $tlsSecret := include "openfilz-web.ingressTlsSecret" . }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "openfilz-web.fullname" . }}
  labels: {{- include "openfilz-web.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with (include "openfilz-web.ingressClassName" .) }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if and $host $tlsSecret }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ $tlsSecret }}
  {{- end }}
  rules:
    - {{- if $host }}
      host: {{ $host }}
      {{- end }}
      http:
        paths:
          - path: {{ .Values.ingress.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "openfilz-web.fullname" . }}
                port:
                  name: http
{{- end }}
