# Example values — OpenShift: Route instead of Ingress.

openshift:
  enabled: true
  route:
    enabled: true
    # hostname: "dms.apps.my-cluster.com"   # empty = OpenShift generates one
    tls:
      enabled: true
      termination: "edge"
      insecureEdgeTerminationPolicy: "Redirect"

ingress:
  enabled: false

app:
  apiUrl: https://test-openfilz-api-ged-lab.openshift.cluster.com/api/v1
  graphQlUrl: https://test-openfilz-api-ged-lab.openshift.cluster.com/graphql/v1

auth:
  enabled: true
  publicAuthority: https://auth.example.com/realms/openfilz
