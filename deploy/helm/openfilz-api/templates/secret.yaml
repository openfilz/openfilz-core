{{- /* Standalone installs only — under openfilz-ce the umbrella owns the DB secret */ -}}
{{- $globalSecret := dig "db" "existingSecret" "" (.Values.global | default dict) -}}
{{- if and (not .Values.database.existingSecret) (not $globalSecret) (ne (include "openfilz-api.ceEnabled" .) "true") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openfilz-api.fullname" . }}-db-credentials
  labels: {{- include "openfilz-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Set database.password explicitly — an empty value generates a NEW random
  # password at every helm upgrade.
  password: {{ .Values.database.password | default (randAlphaNum 32) | quote }}
{{- end }}
