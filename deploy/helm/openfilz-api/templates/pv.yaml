{{- /* Manual hostPath PV — local kind/dev clusters only */ -}}
{{- if and (eq .Values.storage.type "local") .Values.storage.persistence.hostPath (not .Values.storage.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{ include "openfilz-api.fullname" . }}-pv
  labels: {{- include "openfilz-api.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.storage.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.storage.persistence.storageClassName }}
  capacity:
    storage: {{ .Values.storage.persistence.size }}
  hostPath:
    path: {{ .Values.storage.persistence.hostPath }}
{{- end }}
