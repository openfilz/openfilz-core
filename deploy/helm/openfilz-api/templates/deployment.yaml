apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openfilz-api.fullname" . }}
  labels: {{- include "openfilz-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  {{- if eq .Values.storage.type "local" }}
  strategy:
    type: Recreate            # RWO storage PVC — no two pods may mount it at once
  {{- end }}
  selector:
    matchLabels: {{- include "openfilz-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "openfilz-api.labels" . | nindent 8 }}
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.nodeSelector | default (dig "nodeSelector" dict (.Values.global | default dict))) }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with (.Values.tolerations | default (dig "tolerations" list (.Values.global | default dict))) }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/{{ .Values.image.repository }}:{{ include "openfilz-api.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: LANG
              value: C.UTF-8
            - name: LC_ALL
              value: C.UTF-8
            - name: SERVER_PORT
              value: {{ .Values.api.port | quote }}
            # --- Database (application.yml derives the R2DBC + Flyway URLs) ---
            - name: DB_HOST
              value: {{ include "openfilz-api.dbHost" . | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
            - name: DB_NAME
              value: {{ include "openfilz-api.dbName" . | quote }}
            {{- if .Values.database.secretKeys.user }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "openfilz-api.dbSecretName" . }}
                  key: {{ .Values.database.secretKeys.user }}
            {{- else }}
            - name: DB_USER
              value: {{ include "openfilz-api.dbUser" . | quote }}
            {{- end }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openfilz-api.dbSecretName" . }}
                  key: {{ include "openfilz-api.dbPasswordKey" . }}
            - name: SPRING_FLYWAY_BASELINE_ON_MIGRATE
              value: "true"
            - name: SPRING_FLYWAY_BASELINE_VERSION
              value: "0"
            # --- Security / Keycloak ---
            - name: OPENFILZ_SECURITY_NO_AUTH
              value: {{ eq (include "openfilz-api.authEnabled" .) "false" | quote }}
            {{- with (include "openfilz-api.realmInternalUrl" .) }}
            - name: KEYCLOAK_REALM_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with (include "openfilz-api.corsAllowedOrigins" .) }}
            - name: OPENFILZ_SECURITY_CORS_ALLOWED_ORIGINS
              value: {{ . | quote }}
            {{- end }}
            # --- Storage ---
            - name: STORAGE_TYPE
              value: {{ .Values.storage.type | quote }}
            {{- if eq .Values.storage.type "local" }}
            - name: STORAGE_LOCAL_BASE_PATH
              value: {{ .Values.storage.local.basePath | quote }}
            - name: THUMBNAIL_STORAGE_BASE_PATH
              value: {{ .Values.storage.local.basePath | quote }}
            {{- else }}
            - name: MINIO_ENDPOINT
              value: {{ .Values.storage.minio.endpoint | quote }}
            {{- if .Values.storage.minio.existingSecret }}
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.minio.existingSecret }}
                  key: access-key
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.minio.existingSecret }}
                  key: secret-key
            {{- else }}
            - name: MINIO_ACCESS_KEY
              value: {{ .Values.storage.minio.accessKey | quote }}
            - name: MINIO_SECRET_KEY
              value: {{ .Values.storage.minio.secretKey | quote }}
            {{- end }}
            - name: MINIO_BUCKET_NAME
              value: {{ .Values.storage.minio.bucketName | quote }}
            - name: MINIO_REGION
              value: {{ .Values.storage.minio.region | quote }}
            {{- end }}
            # --- URLs ---
            - name: OPENFILZ_INTERNAL_API_BASE_URL
              value: http://{{ include "openfilz-api.fullname" . }}:{{ .Values.service.port }}
            {{- with (include "openfilz-api.publicApiBaseUrl" .) }}
            - name: OPENFILZ_PUBLIC_API_BASE_URL
              value: {{ . | quote }}
            - name: API_ROOT_URL
              value: {{ printf "%s/" . | quote }}
            {{- end }}
            {{- with (include "openfilz-api.publicWebBaseUrl" .) }}
            - name: OPENFILZ_COMMON_WEBPUBLICBASEURL
              value: {{ printf "%s/" . | quote }}
            {{- end }}
            # --- Features / companion services ---
            - name: OPENFILZ_THUMBNAIL_ACTIVE
              value: {{ .Values.features.thumbnails | quote }}
            {{- with .Values.gotenberg.url }}
            - name: GOTENBERG_URL
              value: {{ . | quote }}
            {{- end }}
            - name: OPENFILZ_SOFTDELETE_ACTIVE
              value: {{ .Values.features.softDelete | quote }}
            - name: OPENFILZ_CALCULATECHECKSUM
              value: {{ .Values.features.checksum | quote }}
            - name: ONLYOFFICE_ENABLED
              value: {{ include "openfilz-api.onlyofficeEnabled" . | quote }}
            {{- if eq (include "openfilz-api.onlyofficeEnabled" .) "true" }}
            - name: ONLYOFFICE_URL
              value: {{ include "openfilz-api.onlyofficeInternalUrl" . | quote }}
            - name: ONLYOFFICE_JWT_SECRET
              value: {{ include "openfilz-api.onlyofficeJwtSecret" . | quote }}
            {{- end }}
            - name: OPENFILZ_FULLTEXT_ACTIVE
              value: {{ .Values.features.fulltext | quote }}
            {{- if .Values.features.fulltext }}
            - name: OPENFILZ_FULLTEXT_OPENSEARCH_HOST
              value: {{ .Values.opensearch.host | quote }}
            - name: OPENFILZ_FULLTEXT_OPENSEARCH_PORT
              value: {{ .Values.opensearch.port | quote }}
            - name: OPENFILZ_FULLTEXT_OPENSEARCH_SCHEME
              value: {{ .Values.opensearch.scheme | quote }}
            {{- end }}
            # --- Quotas (MB) ---
            - name: OPENFILZ_QUOTA_FILE_UPLOAD
              value: {{ .Values.quotas.fileUploadMb | quote }}
            - name: OPENFILZ_QUOTA_USER
              value: {{ .Values.quotas.userMb | quote }}
            # --- MCP server (external AI agents over POST /mcp) ---
            - name: OPENFILZ_MCP_ACTIVE
              value: {{ .Values.mcp.active | quote }}
            {{- if .Values.mcp.active }}
            - name: OPENFILZ_MCP_MODE
              value: {{ .Values.mcp.mode | quote }}
            {{- with (include "openfilz-api.mcpAuthorizationServerUrl" .) }}
            # Discovery must advertise the PUBLIC realm URL — the property defaults
            # to KEYCLOAK_REALM_URL (in-cluster), unreachable by MCP hosts.
            - name: OPENFILZ_MCP_AUTHORIZATION_SERVER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.mcp.scopesSupported }}
            - name: OPENFILZ_MCP_SCOPES_SUPPORTED
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.ai.active }}
            # --- AI Document Chat ---
            - name: OPENFILZ_AI_ACTIVE
              value: "true"
            # Chat assistant kill switch: false keeps insights / smart filing / by-kind
            # reorganisation / MCP and drops only the chat (docs/ai-overview.md §6).
            - name: OPENFILZ_AI_CHAT_ACTIVE
              value: {{ .Values.ai.chat.active | quote }}
            - name: OLLAMA_BASE_URL
              value: {{ .Values.ai.ollama.baseUrl | quote }}
            - name: OLLAMA_CHAT_ENABLED
              value: {{ .Values.ai.ollama.chat.enabled | quote }}
            - name: OLLAMA_CHAT_MODEL
              value: {{ .Values.ai.ollama.chat.model | quote }}
            - name: OLLAMA_EMBEDDING_ENABLED
              value: {{ .Values.ai.ollama.embedding.enabled | quote }}
            - name: OLLAMA_EMBEDDING_MODEL
              value: {{ .Values.ai.ollama.embedding.model | quote }}
            - name: TRANSFORMERS_EMBEDDING_ENABLED
              value: {{ .Values.ai.transformers.embedding.enabled | quote }}
            - name: TRANSFORMERS_EMBEDDING_MODEL
              value: {{ .Values.ai.transformers.embedding.model | quote }}
            - name: TRANSFORMERS_EMBEDDING_MODEL_URI
              value: {{ .Values.ai.transformers.embedding.modelUri | quote }}
            - name: TRANSFORMERS_EMBEDDING_TOKENIZER_URI
              value: {{ .Values.ai.transformers.embedding.tokenizerUri | quote }}
            - name: TRANSFORMERS_EMBEDDING_CACHE_DIR
              value: {{ .Values.ai.transformers.embedding.cacheDir | quote }}
            - name: OPENAI_API_KEY
              value: {{ .Values.ai.openai.apiKey | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.ai.openai.baseUrl | quote }}
            - name: OPENAI_CHAT_ENABLED
              value: {{ .Values.ai.openai.chat.enabled | quote }}
            - name: OPENAI_CHAT_MODEL
              value: {{ .Values.ai.openai.chat.model | quote }}
            - name: OPENAI_EMBEDDING_ENABLED
              value: {{ .Values.ai.openai.embedding.enabled | quote }}
            - name: OPENAI_EMBEDDING_MODEL
              value: {{ .Values.ai.openai.embedding.model | quote }}
            - name: ANTHROPIC_API_KEY
              value: {{ .Values.ai.anthropic.apiKey | quote }}
            - name: ANTHROPIC_CHAT_ENABLED
              value: {{ .Values.ai.anthropic.chat.enabled | quote }}
            - name: ANTHROPIC_CHAT_MODEL
              value: {{ .Values.ai.anthropic.chat.model | quote }}
            - name: GOOGLE_API_KEY
              value: {{ .Values.ai.google.apiKey | quote }}
            - name: GOOGLE_CHAT_ENABLED
              value: {{ .Values.ai.google.chat.enabled | quote }}
            - name: GOOGLE_CHAT_MODEL
              value: {{ .Values.ai.google.chat.model | quote }}
            # Document insights (AI category / summary at upload) and smart filing on upload
            - name: OPENFILZ_AI_INSIGHTS_ACTIVE
              value: {{ .Values.ai.insights.active | quote }}
            - name: OPENFILZ_AI_INSIGHTS_MODEL
              value: {{ .Values.ai.insights.model | quote }}
            - name: OPENFILZ_AI_INSIGHTS_DAILY_LIMIT
              value: {{ .Values.ai.insights.dailyLimit | quote }}
            - name: OPENFILZ_AI_INSIGHTS_CONCURRENCY
              value: {{ .Values.ai.insights.concurrency | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_CONCURRENCY
              value: {{ .Values.ai.autoFile.concurrency | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_ACTIVE
              value: {{ .Values.ai.autoFile.active | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_DEFAULT
              value: {{ .Values.ai.autoFile.defaultForUsers | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_NEW_FOLDERS
              value: {{ .Values.ai.autoFile.allowNewFolders | quote }}
            - name: OPENFILZ_AI_INSIGHTS_CATEGORIES
              value: {{ join "," .Values.ai.insights.categories | quote }}
            - name: OPENFILZ_AI_INSIGHTS_CLASSIFIER
              value: {{ .Values.ai.insights.classifier.mode | quote }}
            - name: OPENFILZ_AI_INSIGHTS_CLASSIFIER_MIN_CONFIDENCE
              value: {{ .Values.ai.insights.classifier.minConfidence | quote }}
            - name: OPENFILZ_AI_INSIGHTS_CLASSIFIER_LEARN_FROM
              value: {{ join "," .Values.ai.insights.classifier.learnFrom | quote }}
            - name: OPENFILZ_AI_INSIGHTS_CLASSIFIER_PREFIX
              value: {{ .Values.ai.insights.classifier.prefix | quote }}
            - name: OPENFILZ_AI_INSIGHTS_MAX_CHARS
              value: {{ .Values.ai.insights.maxChars | quote }}
            - name: OPENFILZ_AI_INSIGHTS_MAX_FILE_SIZE
              value: {{ .Values.ai.insights.maxFileSize | quote }}
            - name: OPENFILZ_AI_MAX_ANSWER_TOKENS
              value: {{ .Values.ai.maxAnswerTokens | quote }}
            - name: OPENFILZ_AI_EMBEDDING_VALIDATION
              value: {{ .Values.ai.embedding.validation | quote }}
            - name: OPENFILZ_AI_EMBEDDING_BACKFILL_CONCURRENCY
              value: {{ .Values.ai.embedding.backfillConcurrency | quote }}
            - name: OPENFILZ_AI_REORG_INVENTORY_CACHE_TTL
              value: {{ .Values.ai.reorganization.inventoryCacheTtl | quote }}
            - name: OPENFILZ_AI_REORG_PLAN_RATE_LIMIT
              value: {{ .Values.ai.reorganization.planRateLimit | quote }}
            - name: OPENAI_EMBEDDING_DIMENSIONS
              value: {{ .Values.ai.openai.embedding.dimensions | quote }}
            - name: AI_FALLBACK_ENABLED
              value: {{ .Values.ai.fallback.enabled | quote }}
            - name: AI_FALLBACK_CHAIN
              value: {{ .Values.ai.fallback.chain | quote }}
            - name: AI_FALLBACK_VALIDATION
              value: {{ .Values.ai.fallback.validation | quote }}
            - name: AI_FALLBACK_QUOTA_COOLDOWN
              value: {{ .Values.ai.fallback.quotaCooldown | quote }}
            - name: AI_FALLBACK_UNAVAILABLE_COOLDOWN
              value: {{ .Values.ai.fallback.unavailableCooldown | quote }}
            - name: AI_FALLBACK_KEYS_ANTHROPIC
              value: {{ .Values.ai.fallback.keys.anthropic | quote }}
            - name: AI_FALLBACK_KEYS_GOOGLE
              value: {{ .Values.ai.fallback.keys.google | quote }}
            - name: AI_FALLBACK_KEYS_OPENAI
              value: {{ .Values.ai.fallback.keys.openai | quote }}
            - name: AI_FALLBACK_KEYS_OPENAI_COMPATIBLE
              value: {{ .Values.ai.fallback.keys.openaiCompatible | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_COHERENCE
              value: {{ .Values.ai.autoFile.coherence | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_STAGE1
              value: {{ .Values.ai.autoFile.stage1 | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_RULE_FOLDERS
              value: {{ .Values.ai.autoFile.ruleFolders | quote }}
            - name: OPENFILZ_AI_AUTO_FILE_DEFAULT_LANGUAGE
              value: {{ .Values.ai.autoFile.defaultLanguage | quote }}
            - name: AI_USER_SETTINGS_ENABLED
              value: {{ .Values.ai.userSettings.enabled | quote }}
            - name: AI_SETTINGS_ENCRYPTION_KEY
              value: {{ .Values.ai.userSettings.encryptionKey | quote }}
            {{- end }}
          {{- if or .Values.extraEnv .Values.extraEnvSecretRef }}
          envFrom:
            {{- if .Values.extraEnv }}
            - configMapRef:
                name: {{ include "openfilz-api.fullname" . }}-extra-env
            {{- end }}
            {{- if .Values.extraEnvSecretRef }}
            - secretRef:
                name: {{ .Values.extraEnvSecretRef }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          {{- with .Values.resources }}
          resources: {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if eq .Values.storage.type "local" }}
          volumeMounts:
            - name: storage
              mountPath: {{ .Values.storage.local.basePath }}
          {{- end }}
      {{- if eq .Values.storage.type "local" }}
      volumes:
        - name: storage
          persistentVolumeClaim:
            claimName: {{ include "openfilz-api.storageClaimName" . }}
      {{- end }}
