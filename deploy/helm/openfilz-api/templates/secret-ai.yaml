{{- /* The AI model pair's API key (ai.apiKey) — skipped when ai.existingSecret names one. */ -}}
{{- if and .Values.ai.active .Values.ai.apiKey (not .Values.ai.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openfilz-api.fullname" . }}-ai
  labels: {{- include "openfilz-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.ai.apiKey | quote }}
{{- end }}
