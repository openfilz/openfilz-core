# Default values for the openfilz-api chart.
#
# Env names mirror openfilz-core/deploy/docker-compose/dokploy/compose.yaml (the
# authoritative CE deployment); keep them in sync when the compose evolves.
#
# The chart works standalone (bring your own PostgreSQL / Keycloak) and as a
# subchart of the openfilz-ce umbrella chart. Cross-cutting settings can come
# from the `global:` block (set by the umbrella); every global key has a
# chart-local equivalent below that wins when set.

# Shared values injected by the openfilz-ce umbrella chart — leave empty for a
# standalone install (set the chart-local keys instead).
global: {}
  # ce:
  #   enabled: true          # umbrella wiring: DB host defaults to <release>-postgres,
  #                          # DB secret to <release>-db (key `postgres-password`)
  # imageTag: ""             # pin one image tag for every OpenFilz subchart
  # hosts: { web: "", api: "" }
  # ingress: { enabled: true, className: "", tlsSecretName: "" }
  # auth: { enabled: true, realmInternalUrl: "" }
  # db: { name: "", user: "", existingSecret: "" }   # existingSecret key: postgres-password
  # onlyoffice: { enabled: false, internalUrl: "", jwtSecret: "" }
  # nodeSelector: {}
  # tolerations: []

nameOverride: ""
fullnameOverride: ""

replicaCount: 1

image:
  registry: ghcr.io
  repository: openfilz/openfilz-api
  tag: ""                    # default: global.imageTag, then the chart appVersion
  pullPolicy: Always
  pullSecrets: []

api:
  port: 8080

# Public hostnames (no scheme). Fall back to global.hosts.* when empty. Used
# for the ingress host, the public URLs below and the CORS default.
hosts:
  api: ""
  web: ""

# Public base URLs default to https://<host>. Override for http or non-443
# ports (e.g. kind / port-forward setups).
urls:
  publicApiBaseUrl: ""
  publicWebBaseUrl: ""

auth:
  # null → global.auth.enabled → true. When false the API runs with
  # OPENFILZ_SECURITY_NO_AUTH=true (no Keycloak needed — dev/eval only).
  enabled: null
  # KEYCLOAK_REALM_URL — in-cluster realm URL used for JWT validation.
  realmInternalUrl: ""
  # Comma-separated allowed origins; default: the public web base URL.
  corsAllowedOrigins: ""

database:
  # Empty host → <release>-postgres when installed under openfilz-ce, else localhost.
  host: ""
  port: 5432
  name: ""                   # → global.db.name → dms_db
  user: ""                   # → global.db.user → dms_user
  # Standalone only: password stored in the chart-created secret
  # <fullname>-db-credentials. Set it explicitly — when empty a random one is
  # generated at EVERY upgrade.
  password: ""
  # Bring-your-own secret (wins over the chart-created one and the umbrella's).
  existingSecret: ""
  secretKeys:
    user: ""                 # if set, DB_USER is read from the secret too
    password: "password"

storage:
  type: local                # local | minio
  local:
    basePath: /var/data/openfilz
  # PVC for storage.type=local (documents + thumbnails)
  persistence:
    size: 10Gi
    storageClassName: ""
    accessModes: ["ReadWriteOnce"]
    existingClaim: ""
    # If set (and no existingClaim), a hostPath PersistentVolume is also
    # created — local kind/dev clusters only.
    hostPath: ""
  # Used only when type: minio
  minio:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    existingSecret: ""       # keys: access-key, secret-key
    bucketName: ""
    region: ""

features:
  thumbnails: false          # needs gotenberg.url
  softDelete: true
  checksum: false
  fulltext: false            # needs opensearch.*

gotenberg:
  url: ""                    # e.g. http://shared-gotenberg.openfilz-shared.svc.cluster.local:3000

opensearch:
  host: ""
  port: 9200
  scheme: http

onlyoffice:
  # null → global.onlyoffice.enabled → false
  enabled: null
  internalUrl: ""            # → global.onlyoffice.internalUrl
  jwtSecret: ""              # → global.onlyoffice.jwtSecret

# Quotas (MB, 0 = no limit)
quotas:
  fileUploadMb: 1024
  userMb: 2048

# MCP server — external AI agents over POST /mcp (Claude, Cursor, n8n…; see
# docs/mcp.md). OAuth discovery advertises the PUBLIC realm URL to MCP hosts
# (they sit outside the cluster — never auth.realmInternalUrl); empty falls
# back to global.auth.publicAuthority (the browser-facing issuer). The realm
# must contain the `openfilz-mcp` public PKCE client — realms created before
# the MCP release need it imported once (docs/mcp.md → upgraded deployments).
mcp:
  active: false
  mode: READ_ONLY              # READ_ONLY | READ_WRITE
  authorizationServerUrl: ""   # empty → global.auth.publicAuthority
  # Comma-separated scopes_supported advertised in the protected-resource metadata;
  # empty → application default (openid,profile,email,offline_access).
  scopesSupported: ""

# -- AI Document Chat configuration.
# Set ai.active to true and configure an LLM provider to enable AI features.
# Requires PostgreSQL with pgvector extension.
ai:
  # @param ai.active Enable AI document chat (RAG, function calling, SSE streaming)
  active: false
  # -- Document insights: a model labels each uploaded file (category from a closed list,
  # summary, keywords, language, entities). Needs ai.active. See docs/ai.md §3b.
  insights:
    active: false
    # provider:model for the enrichment (e.g. anthropic:claude-haiku-4-5); empty = the chat model
    model: ""
    dailyLimit: 2000
  # -- Smart filing on upload: OpenFilz chooses the destination folder on the user's request.
  # Needs ai.active and embeddings.
  autoFile:
    active: false
    defaultForUsers: false
    allowNewFolders: true
  # -- Ollama (local LLM)
  ollama:
    baseUrl: "http://ollama:11434"
    chat:
      enabled: false
      model: "llama3"
    embedding:
      enabled: false
      model: "nomic-embed-text"
    # -- Optional in-cluster Ollama server. When deploy.enabled (and ai.active), the chart
    # creates an Ollama Deployment + Service + PVC. The Service is named "ollama" (fixed,
    # matching the default baseUrl above — one Ollama per namespace), and a
    # post-install/post-upgrade Job pulls the models of the enabled chat/embedding
    # providers. Leave disabled to use an external Ollama (point baseUrl at it) or a
    # cloud provider (openai/anthropic/google below).
    deploy:
      enabled: false
      image: "ollama/ollama:latest"
      # Pull the enabled models after install/upgrade (post-install/post-upgrade hook Job)
      pullModels: true
      persistence:
        size: 20Gi
        storageClassName: ""
      # For GPU inference: resources: {limits: {nvidia.com/gpu: 1}} (needs the device plugin)
      resources: {}
  # -- OpenAI-compatible API (cloud LLM)
  openai:
    apiKey: ""
    baseUrl: "https://api.openai.com"
    chat:
      enabled: false
      model: "gpt-4o"
    embedding:
      enabled: false
      model: "text-embedding-3-small"
  # -- Anthropic Claude (chat only — Anthropic has no embeddings API, keep Ollama/OpenAI embeddings)
  anthropic:
    apiKey: ""
    chat:
      enabled: false
      model: "claude-opus-5"
  # -- Google Gemini via the Gemini Developer API (chat only — embeddings stay on Ollama/OpenAI)
  # Google retires model ids, and a retired one fails every chat with a 404 ("no longer
  # available to new users"): set model to "gemini-flash-latest" to track the current flash
  # model instead of pinning one.
  google:
    apiKey: ""
    chat:
      enabled: false
      model: "gemini-3.6-flash"
  # -- Per-user AI settings (BYOK): users override the chat LLM with their own provider + API key.
  # encryptionKey protects the stored keys (base64, 32 bytes): openssl rand -base64 32
  userSettings:
    enabled: false
    encryptionKey: ""

# Extra environment variables injected via a chart-managed ConfigMap (envFrom).
extraEnv: {}
# Existing Secret injected as environment variables via envFrom.
extraEnvSecretRef: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  # null → global.ingress.enabled → true
  enabled: null
  className: ""              # → global.ingress.className
  tlsSecretName: ""          # → global.ingress.tlsSecretName; empty = no TLS block
  annotations: {}
  paths:
    - /
  # Extra Ingress exposing the Swagger/OpenAPI endpoints (off by default).
  swagger:
    enabled: false

# OpenShift: use a Route instead of an Ingress.
openshift:
  enabled: false
  route:
    enabled: false
    hostname: ""             # default: hosts.api (empty = OpenShift generates one)
    tls:
      enabled: true
      termination: "edge"
      insecureEdgeTerminationPolicy: "Redirect"
      # Do not commit plain-text keys/certs — use --set or helm secrets.
      key: ""
      certificate: ""
      caCertificate: ""
      destinationCACertificate: ""

# Paketo buildpack image runs as uid 1002 / gid 1000; fsGroup makes the PVC
# group-writable so no chown init container is needed.
podSecurityContext:
  runAsUser: 1002
  runAsGroup: 1000
  fsGroup: 1000

resources:
  requests: { cpu: 100m, memory: 512Mi }
  limits: { memory: 1Gi }

nodeSelector: {}             # → global.nodeSelector
tolerations: []              # → global.tolerations
