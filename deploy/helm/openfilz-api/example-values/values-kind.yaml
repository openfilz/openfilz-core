# Example values — local kind cluster: no auth, hostPath storage, nginx
# ingress with path-based routing (no hostname), Swagger exposed.

auth:
  enabled: false

ingress:
  className: nginx
  paths:
    - /api
    - /graphql
  swagger:
    enabled: true
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1024m"

urls:
  publicApiBaseUrl: http://localhost
  publicWebBaseUrl: http://localhost

storage:
  type: local
  persistence:
    size: 1Gi
    storageClassName: manual
    hostPath: /tmp/kube-storage     # creates a manual hostPath PV

# For test purposes only — use --set or a secret in production.
database:
  host: dms-postgres-postgresql
  name: dms_db
  user: dms_user
  password: dms_password
