# Example values — OpenShift: Route instead of Ingress, dynamic storage class,
# DB credentials from an existing Secret.

openshift:
  enabled: true
  route:
    enabled: true
    # hostname: "dms-api.apps.my-cluster.com"   # empty = OpenShift generates one
    tls:
      enabled: true
      termination: "edge"
      insecureEdgeTerminationPolicy: "Redirect"

ingress:
  enabled: false

storage:
  type: local
  persistence:
    size: 1Gi
    # storageClassName: thin-csi

database:
  host: my-db.svc.cluster.local
  name: dms_db
  existingSecret: db-credentials
  secretKeys:
    user: user            # DB_USER read from the secret
    password: password
