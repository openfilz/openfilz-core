{{- if and .Values.keycloak.enabled (not .Values.keycloak.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak
  labels:
    {{- include "openfilz-shared.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
type: Opaque
stringData:
  admin-password: {{ required "Set keycloak.adminPassword (or keycloak.existingSecret)" .Values.keycloak.adminPassword | quote }}
  db-password: {{ required "Set keycloak.db.password (or keycloak.existingSecret)" .Values.keycloak.db.password | quote }}
{{- end }}
