{{- if and .Values.onlyoffice.enabled (not .Values.onlyoffice.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-onlyoffice
  labels:
    {{- include "openfilz-shared.labels" . | nindent 4 }}
    app.kubernetes.io/component: onlyoffice
type: Opaque
stringData:
  jwt-secret: {{ required "Set onlyoffice.jwtSecret (or onlyoffice.existingSecret)" .Values.onlyoffice.jwtSecret | quote }}
{{- end }}
