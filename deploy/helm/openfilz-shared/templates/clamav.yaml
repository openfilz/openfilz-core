{{- if .Values.clamav.enabled }}
{{- if .Values.clamav.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-clamav-db
  labels:
    {{- include "openfilz-shared.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.clamav.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.clamav.persistence.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-clamav
  labels:
    {{- include "openfilz-shared.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: clamav
  ports:
    - name: clamd
      port: 3310
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-clamav
  labels:
    {{- include "openfilz-shared.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamav
spec:
  replicas: 1
  strategy:
    type: Recreate            # RWO signature-db PVC — no two pods may mount it at once
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: clamav
  template:
    metadata:
      labels:
        {{- include "openfilz-shared.labels" . | nindent 8 }}
        app.kubernetes.io/component: clamav
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: clamav
          image: {{ .Values.images.clamav }}
          ports:
            - name: clamd
              containerPort: 3310
          # freshclam downloads the full signature DB on first start (empty PVC) —
          # give it up to failureThreshold * periodSeconds before declaring failure.
          startupProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 10
            failureThreshold: {{ .Values.clamav.startupProbeFailureThreshold }}
          readinessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 3310
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources.clamav | nindent 12 }}
          {{- if .Values.clamav.persistence.enabled }}
          volumeMounts:
            - name: signature-db
              mountPath: /var/lib/clamav
          {{- end }}
      {{- if .Values.clamav.persistence.enabled }}
      volumes:
        - name: signature-db
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-clamav-db
      {{- end }}
{{- end }}
