apiVersion: v2
name: openfilz-shared
description: >-
  OpenFilz shared services for the openfilz-shared namespace — Keycloak (realm per
  tenant/demo, with its own small PostgreSQL), OpenSearch (single node), Gotenberg,
  ClamAV and optionally OnlyOffice. Consumed cross-namespace by the demo-ce / demo-ee /
  per-tenant namespaces (labelled openfilz.com/tenant-access=true).
type: application
version: 0.1.0
appVersion: "latest"
keywords:
  - openfilz
  - dms
home: https://openfilz.com
