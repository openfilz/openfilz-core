# OpenFilz Docker Compose - OnlyOffice Document Server Overlay
#
# Usage:
#   docker-compose -f docker-compose.yml -f docker-compose.onlyoffice.yml up -d
#
# Or use the Makefile:
#   make up-onlyoffice

services:
  # =============================================================================
  # OnlyOffice Document Server
  # =============================================================================
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: openfilz-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      # Required, no default: a published value lets anyone forge editor tokens. Generate one with
      # `openssl rand -hex 32` and set ONLYOFFICE_JWT_SECRET in .env (same value reaches the API below).
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required (generate one with: openssl rand -hex 32)}
      JWT_HEADER: Authorization
      # Allow connections from OpenFilz containers
      ALLOW_META_IP_ADDRESS: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    ports:
      - "${ONLYOFFICE_PORT:-8080}:80"
    networks:
      - openfilz-network
    # OnlyOffice needs to reach the API for document downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  # =============================================================================
  # OpenFilz API - OnlyOffice Configuration Override
  # =============================================================================
  openfilz-api:
    environment:
      # OnlyOffice configuration
      ONLYOFFICE_ENABLED: "true"
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://localhost:8080}
      # Save callbacks may only download from the host of ONLYOFFICE_URL plus these (comma-separated,
      # SSRF guard). The document server's container name is allowed by default.
      ONLYOFFICE_ALLOWED_DOWNLOAD_HOSTS: ${ONLYOFFICE_ALLOWED_DOWNLOAD_HOSTS:-onlyoffice}
      ONLYOFFICE_DOWNLOAD_TIMEOUT: ${ONLYOFFICE_DOWNLOAD_TIMEOUT:-120s}
      ONLYOFFICE_MAX_DOWNLOAD_BYTES: ${ONLYOFFICE_MAX_DOWNLOAD_BYTES:-268435456}
      # Must match JWT_SECRET on the document server; the API refuses to start on a blank, short or
      # published value (OnlyOfficeJwtSecretStartupGuard).
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:?ONLYOFFICE_JWT_SECRET is required (generate one with: openssl rand -hex 32)}
