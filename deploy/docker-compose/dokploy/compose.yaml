# OpenFilz Community Edition - Dokploy Compose Configuration
#
# Adapted for Dokploy deployment with Traefik reverse proxy
#
# Requirements:
# 1. Set environment variables in .env.dokploy-ce or Dokploy's Environment tab
# 2. Configure DNS A records for all hostnames to point to the Dokploy server
# 3. Mount required files in ${OPENFILZ_FILES_BASE:?Set OPENFILZ_FILES_BASE in .env}/ directory
#
# Documentation: https://docs.openfilz.com

volumes:
  postgres-data:
  openfilz-storage:
  onnx-cache:
  onlyoffice-data:
  onlyoffice-logs:
  opensearch-data1:
  opensearch-data2:
  ollama-data:

networks:
  dokploy-network:
    external: true

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg17}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openfilz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-openfilz}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${OPENFILZ_FILES_BASE:?Set OPENFILZ_FILES_BASE in .env}/db-create.sh:/docker-entrypoint-initdb.d/init-keycloak-db.sh:ro
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openfilz} -d ${POSTGRES_DB:-openfilz}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================================================
  # Keycloak Authentication Server
  # =============================================================================
  keycloak:
    image: ${KEYCLOAK_IMAGE:-ghcr.io/openfilz/keycloak:26.7}
    restart: unless-stopped
    pull_policy: always
    command:
      - start
      - --import-realm
    environment:
      # Admin credentials
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # Database
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak_db}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

      # Hostname (Dokploy/Traefik proxy)
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_URL: https://${KEYCLOAK_HOSTNAME}
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"

      # Realm import substitution variables (resolved by entrypoint.sh envsubst)
      KEYCLOAK_PUBLIC_URL: https://${KEYCLOAK_HOSTNAME}
      OPENFILZ_WEB_ROOT_URL: https://${WEB_HOSTNAME:-app.openfilz.com}

      # Default roles for new users
      KEYCLOAK_DEFAULT_ROLE_1: ${KEYCLOAK_DEFAULT_ROLE_1:-READER}
      KEYCLOAK_DEFAULT_ROLE_2: ${KEYCLOAK_DEFAULT_ROLE_2:-READER}
      KEYCLOAK_DEFAULT_ROLE_3: ${KEYCLOAK_DEFAULT_ROLE_3:-READER}
      KEYCLOAK_DEFAULT_ROLE_4: ${KEYCLOAK_DEFAULT_ROLE_4:-READER}
      KEYCLOAK_DEFAULT_GROUP_1: ${KEYCLOAK_DEFAULT_GROUP_1:-/OPENFILZ/READER}
      KEYCLOAK_DEFAULT_GROUP_2: ${KEYCLOAK_DEFAULT_GROUP_2:-/OPENFILZ/READER}
      KEYCLOAK_DEFAULT_GROUP_3: ${KEYCLOAK_DEFAULT_GROUP_3:-/OPENFILZ/READER}
      KEYCLOAK_DEFAULT_GROUP_4: ${KEYCLOAK_DEFAULT_GROUP_4:-/OPENFILZ/READER}

      # SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-noreply@openfilz.com}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}

      # Identity Providers / Social Login
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}

    networks:
      - dokploy-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000;echo -e 'GET /health/ready HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openfilz-keycloak.service=openfilz-keycloak"
      - "traefik.http.routers.openfilz-keycloak.rule=Host(`${KEYCLOAK_HOSTNAME}`)"
      - "traefik.http.routers.openfilz-keycloak.entrypoints=websecure"
      - "traefik.http.routers.openfilz-keycloak.tls.certResolver=letsencrypt"
      - "traefik.http.services.openfilz-keycloak.loadbalancer.server.port=8080"

  # =============================================================================
  # Storage Volume Initialization
  # Paketo buildpack images run as UID 1000 (cnb); Docker creates named volumes
  # as root. This init container sets correct ownership before the API starts.
  # Only performs chown when STORAGE_TYPE=local.
  # =============================================================================
  storage-init:
    image: busybox:latest
    command: ["sh", "-c", "if [ \"$STORAGE_TYPE\" = \"local\" ]; then chown -R 1002:1000 /var/data/openfilz; else echo 'Storage type is not local, skipping chown'; fi"]
    environment:
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
    volumes:
      - openfilz-storage:/var/data/openfilz
    networks:
      - dokploy-network

  # =============================================================================
  # OpenFilz API (Backend)
  # =============================================================================
  openfilz-api:
    image: ${OPENFILZ_API_IMAGE:-ghcr.io/openfilz/openfilz-api:latest}
    restart: unless-stopped
    pull_policy: always
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

      # Database (R2DBC + Flyway)
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-openfilz}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-openfilz}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-openfilz}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-openfilz}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      SPRING_FLYWAY_BASELINE_VERSION: "0"

      # Security / Keycloak
      OPENFILZ_SECURITY_NO_AUTH: "false"
      KEYCLOAK_REALM_URL: http://keycloak:8080/realms/openfilz
      OPENFILZ_SECURITY_CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://app.openfilz.com,https://docs.openfilz.com}

      # Storage
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_BASE_PATH: /var/data/openfilz
      THUMBNAIL_STORAGE_BASE_PATH: ${THUMBNAIL_STORAGE_BASE_PATH:-/var/data/openfilz}

      # URLs
      OPENFILZ_INTERNAL_API_BASE_URL: ${OPENFILZ_INTERNAL_API_BASE_URL:-http://openfilz-api:8080}
      OPENFILZ_PUBLIC_API_BASE_URL: ${OPENFILZ_PUBLIC_API_BASE_URL:-https://api.openfilz.com}
      OPENFILZ_COMMON_WEBPUBLICBASEURL: ${OPENFILZ_COMMON_WEBPUBLICBASEURL:-https://app.openfilz.com/}
      API_ROOT_URL: https://${API_HOSTNAME:-api.openfilz.com}/

      # Server configuration
      SERVER_PORT: 8080
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS}

      # OnlyOffice
      ONLYOFFICE_ENABLED: "true"
      ONLYOFFICE_URL: ${ONLYOFFICE_URL:-http://onlyoffice}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}

      # Feature toggles
      # Public shared demo: the web app shows the demo disclaimers (shared-visibility
      # warning + upsell links). Leave false for every real installation.
      OPENFILZ_DEMO_MODE: ${OPENFILZ_DEMO_MODE:-false}
      OPENFILZ_THUMBNAIL_ACTIVE: ${OPENFILZ_THUMBNAIL_ACTIVE:-true}
      OPENFILZ_SOFTDELETE_ACTIVE: ${OPENFILZ_SOFTDELETE_ACTIVE:-true}
      OPENFILZ_CALCULATECHECKSUM: ${OPENFILZ_CALCULATECHECKSUM:-true}
      GOTENBERG_URL: ${GOTENBERG_URL:-http://gotenberg:3000}

      # Full-text search
      OPENFILZ_FULLTEXT_ACTIVE: ${OPENFILZ_FULLTEXT_ACTIVE:-true}
      OPENFILZ_FULLTEXT_OPENSEARCH_HOST: ${OPENFILZ_FULLTEXT_OPENSEARCH_HOST:-opensearch-node1}
      OPENFILZ_FULLTEXT_OPENSEARCH_PORT: 9200
      OPENFILZ_FULLTEXT_OPENSEARCH_SCHEME: http

      # Quotas (MB)
      OPENFILZ_QUOTA_FILE_UPLOAD: ${OPENFILZ_QUOTA_FILE_UPLOAD:-1024}
      OPENFILZ_QUOTA_USER: ${OPENFILZ_QUOTA_USER:-2048}

      # e-Sign electronic signatures (optional - set OPENFILZ_SIGNATURE_ACTIVE=true to enable)
      # Master switch over the Signatures menu, /api/v1/signatures/**, the public signing
      # chain and the expiry sweeper. Read at runtime, but the public security chain reads
      # it once at startup, so flipping it needs a restart. Reference: docs/esign.md
      OPENFILZ_SIGNATURE_ACTIVE: ${OPENFILZ_SIGNATURE_ACTIVE:-false}
      OPENFILZ_SIGNATURE_REQUIRE_REQUESTER_ROLE: ${OPENFILZ_SIGNATURE_REQUIRE_REQUESTER_ROLE:-false}
      OPENFILZ_SIGNATURE_DEFAULT_EXPIRY_DAYS: ${OPENFILZ_SIGNATURE_DEFAULT_EXPIRY_DAYS:-30}
      # Envelopes one initiator may create per calendar month; 0 = unlimited.
      OPENFILZ_SIGNATURE_QUOTA_ENVELOPES_PER_MONTH: ${OPENFILZ_SIGNATURE_QUOTA_ENVELOPES_PER_MONTH:-0}
      # Signing links are built from OPENFILZ_COMMON_WEBPUBLICBASEURL above (keep the trailing /).
      # Seal identity: self-signed-dev (ephemeral dev cert) | pkcs12 | openfilz-cloud.
      # A .p12 must be mounted into the container for the keystore path to resolve.
      OPENFILZ_SIGNATURE_SEAL_PROVIDER: ${OPENFILZ_SIGNATURE_SEAL_PROVIDER:-self-signed-dev}
      OPENFILZ_SIGNATURE_SEAL_KEYSTORE_PATH: ${OPENFILZ_SIGNATURE_SEAL_KEYSTORE_PATH:-}
      OPENFILZ_SIGNATURE_SEAL_KEYSTORE_PASSWORD: ${OPENFILZ_SIGNATURE_SEAL_KEYSTORE_PASSWORD:-}
      OPENFILZ_SIGNATURE_SEAL_KEYSTORE_ALIAS: ${OPENFILZ_SIGNATURE_SEAL_KEYSTORE_ALIAS:-openfilz-seal}
      OPENFILZ_SIGNATURE_CLOUD_API_KEY: ${OPENFILZ_SIGNATURE_CLOUD_API_KEY:-}
      # e-Sign e-mails reuse the SMTP_* settings shared with Keycloak. With SMTP_HOST empty,
      # invitations, reminders and OTP codes are only written to the application log
      # ([e-sign][no-smtp] ...) and EMAIL_OTP recipients are refused at envelope creation.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      OPENFILZ_SIGNATURE_MAIL_FROM: ${OPENFILZ_SIGNATURE_MAIL_FROM:-noreply@openfilz.com}
      OPENFILZ_SIGNATURE_MAIL_FROM_NAME: ${OPENFILZ_SIGNATURE_MAIL_FROM_NAME:-OpenFilz e-Sign}

      # AI Document Chat (optional — set OPENFILZ_AI_ACTIVE=true to enable)
      OPENFILZ_AI_ACTIVE: ${OPENFILZ_AI_ACTIVE:-false}
      # Kill switch for the in-app chat assistant alone: off hides the chat button and
      # "Organise with AI" and answers 404 on /ai/chat**, while insights, smart filing, the
      # by-kind reorganisation and MCP keep working (docs/ai-overview.md §6).
      OPENFILZ_AI_CHAT_ACTIVE: ${OPENFILZ_AI_CHAT_ACTIVE:-true}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_ENABLED: ${OLLAMA_CHAT_ENABLED:-false}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-llama3}
      OLLAMA_EMBEDDING_ENABLED: ${OLLAMA_EMBEDDING_ENABLED:-false}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      # In-process embeddings: the model runs inside the API through ONNX Runtime — no Ollama, no
      # embedding server; wins over Ollama/OpenAI when enabled. Fetched once from Hugging Face into
      # the cache directory (a volume below). Default nomic-embed-text-v1.5 quantised, 768 dims.
      TRANSFORMERS_EMBEDDING_ENABLED: ${TRANSFORMERS_EMBEDDING_ENABLED:-false}
      TRANSFORMERS_EMBEDDING_MODEL: ${TRANSFORMERS_EMBEDDING_MODEL:-nomic-embed-text-v1.5}
      TRANSFORMERS_EMBEDDING_MODEL_URI: ${TRANSFORMERS_EMBEDDING_MODEL_URI:-https://huggingface.co/nomic-ai/nomic-embed-text-v1.5/resolve/main/onnx/model_quantized.onnx}
      TRANSFORMERS_EMBEDDING_TOKENIZER_URI: ${TRANSFORMERS_EMBEDDING_TOKENIZER_URI:-https://huggingface.co/nomic-ai/nomic-embed-text-v1.5/resolve/main/tokenizer.json}
      TRANSFORMERS_EMBEDDING_CACHE_DIR: /app/onnx-cache
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_CHAT_ENABLED: ${OPENAI_CHAT_ENABLED:-false}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-4o}
      OPENAI_EMBEDDING_ENABLED: ${OPENAI_EMBEDDING_ENABLED:-false}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSIONS: ${OPENAI_EMBEDDING_DIMENSIONS:-768}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_ENABLED: ${ANTHROPIC_CHAT_ENABLED:-false}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-claude-opus-5}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_CHAT_ENABLED: ${GOOGLE_CHAT_ENABLED:-false}
      GOOGLE_CHAT_MODEL: ${GOOGLE_CHAT_MODEL:-gemini-3.6-flash}
      # Automatic failover when the active chat model is out of quota, retired, or unreachable
      # (see openfilz.ai.fallback). Chain entries are 'provider:model', tried in order.
      AI_FALLBACK_ENABLED: ${AI_FALLBACK_ENABLED:-false}
      AI_FALLBACK_CHAIN: ${AI_FALLBACK_CHAIN:-}
      # Extra API keys per provider (comma-separated, tried in order). Quota is charged per
      # key, so a provider rotates to its next key once every chain model is spent on the
      # current one. Leave empty to keep using the single key above.
      AI_FALLBACK_KEYS_GOOGLE: ${AI_FALLBACK_KEYS_GOOGLE:-}
      AI_FALLBACK_KEYS_ANTHROPIC: ${AI_FALLBACK_KEYS_ANTHROPIC:-}
      AI_FALLBACK_KEYS_OPENAI: ${AI_FALLBACK_KEYS_OPENAI:-}
      AI_FALLBACK_KEYS_OPENAI_COMPATIBLE: ${AI_FALLBACK_KEYS_OPENAI_COMPATIBLE:-}
      # FAIL_FAST refuses to start when a chain provider has no key; WARN starts anyway.
      AI_FALLBACK_VALIDATION: ${AI_FALLBACK_VALIDATION:-FAIL_FAST}
      AI_FALLBACK_QUOTA_COOLDOWN: ${AI_FALLBACK_QUOTA_COOLDOWN:-5m}
      AI_FALLBACK_UNAVAILABLE_COOLDOWN: ${AI_FALLBACK_UNAVAILABLE_COOLDOWN:-6h}
      # Per-user AI settings (BYOK) — needs an encryption key: openssl rand -base64 32
      AI_USER_SETTINGS_ENABLED: ${AI_USER_SETTINGS_ENABLED:-false}
      AI_SETTINGS_ENCRYPTION_KEY: ${AI_SETTINGS_ENCRYPTION_KEY:-}
      # Document insights (AI category / summary / entities at upload) and smart filing on
      # upload (OpenFilz chooses the folder on the user's request). Both need
      # OPENFILZ_AI_ACTIVE=true; smart filing also needs embeddings. See docs/ai.md §3b.
      OPENFILZ_AI_INSIGHTS_ACTIVE: ${OPENFILZ_AI_INSIGHTS_ACTIVE:-false}
      OPENFILZ_AI_INSIGHTS_MODEL: ${OPENFILZ_AI_INSIGHTS_MODEL:-}
      OPENFILZ_AI_INSIGHTS_DAILY_LIMIT: ${OPENFILZ_AI_INSIGHTS_DAILY_LIMIT:-2000}
      # Parallel model calls (insights) and documents filed at once (smart filing) — raise both for bulk uploads
      OPENFILZ_AI_INSIGHTS_CONCURRENCY: ${OPENFILZ_AI_INSIGHTS_CONCURRENCY:-2}
      OPENFILZ_AI_AUTO_FILE_CONCURRENCY: ${OPENFILZ_AI_AUTO_FILE_CONCURRENCY:-2}
      OPENFILZ_AI_AUTO_FILE_ACTIVE: ${OPENFILZ_AI_AUTO_FILE_ACTIVE:-false}
      OPENFILZ_AI_AUTO_FILE_DEFAULT: ${OPENFILZ_AI_AUTO_FILE_DEFAULT:-false}
      OPENFILZ_AI_AUTO_FILE_NEW_FOLDERS: ${OPENFILZ_AI_AUTO_FILE_NEW_FOLDERS:-true}
      # The closed category list of the insights (also offered by the details panel's kind editor)
      OPENFILZ_AI_INSIGHTS_CATEGORIES: ${OPENFILZ_AI_INSIGHTS_CATEGORIES:-invoice,quote,contract,report,letter,cv,presentation,spreadsheet,form,id-document,receipt,minutes,specification,manual,other}
      # Who names the category: llm (the chat model, default), prototype (embedding descriptions,
      # no model), learned (the library's own labelled documents, no model), auto (learned, then
      # the model below the confidence). learned-from: whose labels teach (model,user by default).
      OPENFILZ_AI_INSIGHTS_CLASSIFIER: ${OPENFILZ_AI_INSIGHTS_CLASSIFIER:-llm}
      OPENFILZ_AI_INSIGHTS_CLASSIFIER_MIN_CONFIDENCE: ${OPENFILZ_AI_INSIGHTS_CLASSIFIER_MIN_CONFIDENCE:-0.5}
      OPENFILZ_AI_INSIGHTS_CLASSIFIER_LEARN_FROM: ${OPENFILZ_AI_INSIGHTS_CLASSIFIER_LEARN_FROM:-model,user}
      OPENFILZ_AI_INSIGHTS_CLASSIFIER_PREFIX: ${OPENFILZ_AI_INSIGHTS_CLASSIFIER_PREFIX:-}
      OPENFILZ_AI_INSIGHTS_MAX_CHARS: ${OPENFILZ_AI_INSIGHTS_MAX_CHARS:-6000}
      OPENFILZ_AI_INSIGHTS_MAX_FILE_SIZE: ${OPENFILZ_AI_INSIGHTS_MAX_FILE_SIZE:-50MB}
      # Longest answer of the insights / filing model calls; a thinking model counts its thoughts in it
      OPENFILZ_AI_MAX_ANSWER_TOKENS: ${OPENFILZ_AI_MAX_ANSWER_TOKENS:-4096}
      # Embedding-model change policy: fail-fast (default) refuses to start when the embedding
      # provider/model changed while vectors exist; warn starts anyway (mixed vector spaces until
      # the library is re-embedded) — what a provider switch (Ollama -> in-process) needs.
      OPENFILZ_AI_EMBEDDING_VALIDATION: ${OPENFILZ_AI_EMBEDDING_VALIDATION:-fail-fast}
      # Documents embedded in parallel by POST /api/v1/ai/embeddings/backfill (after a provider switch)
      OPENFILZ_AI_EMBEDDING_BACKFILL_CONCURRENCY: ${OPENFILZ_AI_EMBEDDING_BACKFILL_CONCURRENCY:-2}
      OPENFILZ_AI_REORG_INVENTORY_CACHE_TTL: ${OPENFILZ_AI_REORG_INVENTORY_CACHE_TTL:-2m}
      OPENFILZ_AI_REORG_PLAN_RATE_LIMIT: ${OPENFILZ_AI_REORG_PLAN_RATE_LIMIT:-20}
      # Smart filing stage 1: how a winning folder is judged a home (category | similarity | both),
      # how the folder is picked (vote | fit); the rule stage (a known kind with no home goes to the
      # scope's Invoices / Factures / Rechnungen folder, found or created, no model) and its
      # fallback language. See docs/ai.md §3b–3c for the measurements behind the defaults.
      OPENFILZ_AI_AUTO_FILE_COHERENCE: ${OPENFILZ_AI_AUTO_FILE_COHERENCE:-category}
      OPENFILZ_AI_AUTO_FILE_STAGE1: ${OPENFILZ_AI_AUTO_FILE_STAGE1:-vote}
      OPENFILZ_AI_AUTO_FILE_RULE_FOLDERS: ${OPENFILZ_AI_AUTO_FILE_RULE_FOLDERS:-true}
      OPENFILZ_AI_AUTO_FILE_DEFAULT_LANGUAGE: ${OPENFILZ_AI_AUTO_FILE_DEFAULT_LANGUAGE:-en}

      # MCP server — external AI agents over POST /mcp (see docs/mcp.md).
      OPENFILZ_MCP_ACTIVE: ${OPENFILZ_MCP_ACTIVE:-false}
      OPENFILZ_MCP_MODE: ${OPENFILZ_MCP_MODE:-READ_ONLY}
      # OAuth scopes advertised to MCP hosts in the protected-resource metadata
      OPENFILZ_MCP_SCOPES_SUPPORTED: ${OPENFILZ_MCP_SCOPES_SUPPORTED:-openid,profile,email,offline_access}
      # Advertised in the RFC 9728 protected-resource metadata and the settings page.
      # KEYCLOAK_REALM_URL above is the internal hostname, unreachable by MCP hosts —
      # this must be the public realm URL.
      OPENFILZ_MCP_AUTHORIZATION_SERVER_URL: https://${KEYCLOAK_HOSTNAME:-auth.openfilz.com}/realms/openfilz

    volumes:
      - openfilz-storage:/var/data/openfilz
      - onnx-cache:/app/onnx-cache   # the downloaded in-process embedding model, kept across restarts
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "while read line; do case $$line in *:1F90*) exit 0;; esac; done < /proc/net/tcp6 2>/dev/null; exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openfilz-api.service=openfilz-api"
      - "traefik.http.routers.openfilz-api.rule=Host(`${API_HOSTNAME:-api.openfilz.com}`)"
      - "traefik.http.routers.openfilz-api.entrypoints=websecure"
      - "traefik.http.routers.openfilz-api.tls.certResolver=letsencrypt"
      - "traefik.http.services.openfilz-api.loadbalancer.server.port=8080"

  # =============================================================================
  # OnlyOffice Document Server
  # =============================================================================
  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      JWT_HEADER: Authorization
      ALLOW_META_IP_ADDRESS: "true"
      ALLOW_PRIVATE_IP_ADDRESS: "true"
    volumes:
      - onlyoffice-data:/var/www/onlyoffice/Data
      - onlyoffice-logs:/var/log/onlyoffice
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openfilz-onlyoffice.rule=Host(`${ONLYOFFICE_HOSTNAME:-docs.openfilz.com}`)"
      - "traefik.http.routers.openfilz-onlyoffice.middlewares=onlyoffice-headers"
      - "traefik.http.middlewares.onlyoffice-headers.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.onlyoffice-headers.headers.accessControlAllowOriginList=https://${API_HOSTNAME:-api.openfilz.com},https://${WEB_HOSTNAME:-app.openfilz.com}"
      - "traefik.http.routers.openfilz-onlyoffice.entrypoints=websecure"
      - "traefik.http.routers.openfilz-onlyoffice.tls.certResolver=letsencrypt"
      - "traefik.http.services.openfilz-onlyoffice.loadbalancer.server.port=80"

  # =============================================================================
  # OpenFilz Web (Frontend)
  # =============================================================================
  openfilz-web:
    image: ${OPENFILZ_WEB_IMAGE:-ghcr.io/openfilz/openfilz-web:latest}
    restart: unless-stopped
    pull_policy: always
    depends_on:
      openfilz-api:
        condition: service_healthy
    environment:
      # Angular runtime config → the container writes ngx-env.js at startup from these
      # NG_APP_* values (no mounted file). All derived from the hostnames in .env.
      NG_APP_API_URL: https://${API_HOSTNAME:-api.openfilz.com}/api/v1
      NG_APP_GRAPHQL_URL: https://${API_HOSTNAME:-api.openfilz.com}/graphql/v1
      NG_APP_AUTHENTICATION_ENABLED: "true"
      NG_APP_AUTHENTICATION_AUTHORITY: https://${KEYCLOAK_HOSTNAME:-auth.openfilz.com}/realms/openfilz
      NG_APP_AUTHENTICATION_CLIENT_ID: openfilz-web
      NG_APP_ONLYOFFICE_ENABLED: "true"
      NG_APP_ONLYOFFICE_URL: https://${ONLYOFFICE_HOSTNAME:-docs.openfilz.com}
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openfilz-web.service=openfilz-web"
      - "traefik.http.routers.openfilz-web.rule=Host(`${WEB_HOSTNAME:-app.openfilz.com}`)"
      - "traefik.http.routers.openfilz-web.entrypoints=websecure"
      - "traefik.http.routers.openfilz-web.tls.certResolver=letsencrypt"
      - "traefik.http.services.openfilz-web.loadbalancer.server.port=8080"

  # =============================================================================
  # Gotenberg - PDF/Office Document Thumbnails
  # =============================================================================
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--libreoffice-restart-after=100"
      - "--libreoffice-auto-start=true"
      - "--log-level=info"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =============================================================================
  # OpenSearch Cluster - Full-Text Search (2-node)
  # =============================================================================
  opensearch-node1:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node1
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data1:/usr/share/opensearch/data
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  opensearch-node2:
    image: opensearchproject/opensearch:2.19.1
    restart: unless-stopped
    environment:
      - cluster.name=opensearch-cluster
      - node.name=opensearch-node2
      - discovery.seed_hosts=opensearch-node1,opensearch-node2
      - cluster.initial_cluster_manager_nodes=opensearch-node1,opensearch-node2
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "DISABLE_INSTALL_DEMO_CONFIG=true"
      - "DISABLE_SECURITY_PLUGIN=true"
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch-data2:/usr/share/opensearch/data
    networks:
      - dokploy-network

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.19.1
    restart: unless-stopped
    environment:
      - 'OPENSEARCH_HOSTS=["http://opensearch-node1:9200","http://opensearch-node2:9200"]'
      - "DISABLE_SECURITY_DASHBOARDS_PLUGIN=true"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.opensearch-dashboards.service=opensearch-dashboards"
      - "traefik.http.routers.opensearch-dashboards.rule=Host(`${OPENSEARCH_DASHBOARDS_HOSTNAME:-ops.openfilz.com}`)"
      - "traefik.http.routers.opensearch-dashboards.entrypoints=websecure"
      - "traefik.http.routers.opensearch-dashboards.tls.certResolver=letsencrypt"
      - "traefik.http.routers.opensearch-dashboards.middlewares=opensearch-dashboards-auth"
      - "traefik.http.middlewares.opensearch-dashboards-auth.basicauth.users=${OPENSEARCH_DASHBOARDS_BASIC_AUTH}"
      - "traefik.http.services.opensearch-dashboards.loadbalancer.server.port=5601"

  # ===========================================================================
  # Ollama — local LLM server for the AI document chat (optional)
  #
  # Deployed only when an Ollama provider is enabled: the profile value IS the
  # boolean (same trick as the EE optional services), so with the fixed
  # activator COMPOSE_PROFILES=true in the environment, this service is created
  # when OLLAMA_CHAT_ENABLED=true and/or OLLAMA_EMBEDDING_ENABLED=true, and
  # skipped when both are false. Also set OPENFILZ_AI_ACTIVE=true (see the
  # openfilz-api environment above) — and note the postgres image must be
  # pgvector-enabled (the default pgvector/pgvector:pg17 already is).
  # No service depends_on ollama: the API reaches it lazily at call time.
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles: ["${OLLAMA_CHAT_ENABLED:-false}", "${OLLAMA_EMBEDDING_ENABLED:-false}"]
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Pulls the enabled models once Ollama is healthy (idempotent re-pulls).
  ollama-init:
    image: curlimages/curl:latest
    restart: "no"
    profiles: ["${OLLAMA_CHAT_ENABLED:-false}", "${OLLAMA_EMBEDDING_ENABLED:-false}"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "${OLLAMA_CHAT_ENABLED:-false}" = "true" ]; then
          echo "Pulling chat model: ${OLLAMA_CHAT_MODEL:-llama3}..."
          curl -sf http://ollama:11434/api/pull -d "{\"name\": \"${OLLAMA_CHAT_MODEL:-llama3}\"}"
        fi
        if [ "${OLLAMA_EMBEDDING_ENABLED:-false}" = "true" ]; then
          echo "Pulling embedding model: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}..."
          curl -sf http://ollama:11434/api/pull -d "{\"name\": \"${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}\"}"
        fi
        echo "Models ready."
    networks:
      - dokploy-network
