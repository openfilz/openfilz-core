passwordResetBody=Hallo,\n\nWir haben eine Anfrage erhalten, Ihr {2}-Passwort zur\u00fcckzusetzen.\n\nKlicken Sie auf den folgenden Link, um ein neues Passwort festzulegen:\n\n{0}\n\nDieser Link l\u00e4uft in {3} ab.\n\nWenn Sie keine Passwort-Zur\u00fccksetzung angefordert haben, k\u00f6nnen Sie diese E-Mail ignorieren. Ihr Passwort bleibt unver\u00e4ndert.\n\nMit freundlichen Gr\u00fc\u00dfen,\nDas {2}-Team

