# OpenFilz Email Templates - Dutch

# Email Verification
# Arguments: {0} link, {2} product name, {3} expiry
emailVerificationSubject=Verifieer uw e-mailadres
emailVerificationBody=Welkom bij {2}!\n\nEr is een {2}-account aangemaakt met dit e-mailadres. Als u dit was, klik dan op de onderstaande link om uw e-mailadres te verifi\u00ebren:\n\n{0}\n\nDeze link verloopt binnen {3}.\n\nAls u dit account niet heeft aangemaakt, kunt u deze e-mail veilig negeren.\n\nMet vriendelijke groet,\nHet {2}-team

# Password Reset
# Arguments: {0} link, {2} product name, {3} expiry
passwordResetSubject=Stel uw wachtwoord opnieuw in
passwordResetBody=Hallo,\n\nWe hebben een verzoek ontvangen om uw {2}-wachtwoord opnieuw in te stellen.\n\nKlik op de onderstaande link om een nieuw wachtwoord in te stellen:\n\n{0}\n\nDeze link verloopt binnen {3}.\n\nAls u geen wachtwoordherstel heeft aangevraagd, kunt u deze e-mail veilig negeren. Uw wachtwoord blijft ongewijzigd.\n\nMet vriendelijke groet,\nHet {2}-team

# Execute Actions (generic action email)
# Arguments: {0} link, {2} product name, {3} expiry, {4} required actions
executeActionsSubject=U bent uitgenodigd om samen aan documenten te werken
executeActionsBody=Welkom bij {2}!\n\nU bent uitgenodigd om samen te werken aan documenten. Klik op de onderstaande link om uw account in te stellen:\n\n{0}\n\nU wordt gevraagd uw e-mail te verifi\u00ebren, uw profiel te voltooien en een wachtwoord te kiezen.\n\nDeze link verloopt binnen {3}.\n\nAls u deze uitnodiging niet verwachtte, kunt u deze e-mail veilig negeren.\n\nMet vriendelijke groet,\nHet {2}-team

