# Identity provider link
# Arguments: {0} provider, {1} product name, {3} link, {4} expiry
identityProviderLinkSubject={0}-account koppelen
identityProviderLinkBody=Iemand wil uw {0}-account koppelen aan uw {1}-account.\n\nAls u dit was, klik dan op de onderstaande link om de accounts te koppelen:\n\n{3}\n\nDeze link verloopt binnen {4}.\n\nAls u niet zelf op dit moment op deze manier bij {1} probeert in te loggen, open de link dan niet: iemand anders zou dan toegang krijgen tot uw account.\n\nMet vriendelijke groet,\nHet {1}-team

