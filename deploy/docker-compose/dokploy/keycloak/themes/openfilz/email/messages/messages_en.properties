# OpenFilz Email Templates - English

# Email Verification
# Arguments: {0} link, {2} product name, {3} expiry
emailVerificationSubject=Verify your email address
emailVerificationBody=Welcome to {2}!\n\nSomeone has created an account on {2} with this email address. If this was you, click the link below to verify your email address:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you did not create this account, you can safely ignore this email.\n\nBest regards,\nThe {2} Team

# Password Reset
# Arguments: {0} link, {2} product name, {3} expiry
passwordResetSubject=Reset your password
passwordResetBody=Hello,\n\nWe received a request to reset your {2} password.\n\nClick the link below to set a new password:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you did not request a password reset, you can safely ignore this email. Your password will remain unchanged.\n\nBest regards,\nThe {2} Team

# Execute Actions (generic action email)
# Arguments: {0} link, {2} product name, {3} expiry, {4} required actions
executeActionsSubject=You''re invited to collaborate on documents
executeActionsBody=Welcome to {2}!\n\nYou have been invited to collaborate on documents. Click the link below to set up your account:\n\n{0}\n\nYou will be asked to verify your email, complete your profile and choose a password.\n\nThis link will expire within {3}.\n\nIf you were not expecting this invitation, you can safely ignore this email.\n\nBest regards,\nThe {2} Team

