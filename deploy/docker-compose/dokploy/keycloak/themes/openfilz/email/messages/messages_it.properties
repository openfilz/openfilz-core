identityProviderLinkBody=Qualcuno vuole collegare il tuo account {0} con il tuo account {1}.\n\nSe sei stato tu, clicca sul link qui sotto per collegare gli account:\n\n{3}\n\nQuesto link scadr\u00e0 entro {4}.\n\nSe non stai cercando di accedere a {1} in questo modo proprio ora, non aprire il link: darebbe a un''altra persona l''accesso al tuo account.\n\nCordiali saluti,\nIl team di {1}

