# Email Verification
# Arguments: {0} link, {2} product name, {3} expiry
emailVerificationSubject=Verifica il tuo indirizzo email
emailVerificationBody=Benvenuto su {2}!\n\nUn account {2} \u00e8 stato creato con questo indirizzo email. Se sei stato tu, clicca sul link qui sotto per verificare il tuo indirizzo email:\n\n{0}\n\nQuesto link scadr\u00e0 entro {3}.\n\nSe non hai creato questo account, puoi ignorare questa email in tutta sicurezza.\n\nCordiali saluti,\nIl team di {2}

# Password Reset
# Arguments: {0} link, {2} product name, {3} expiry
passwordResetSubject=Reimposta la tua password
passwordResetBody=Ciao,\n\nAbbiamo ricevuto una richiesta di reimpostazione della tua password {2}.\n\nClicca sul link qui sotto per impostare una nuova password:\n\n{0}\n\nQuesto link scadr\u00e0 entro {3}.\n\nSe non hai richiesto la reimpostazione della password, puoi ignorare questa email in tutta sicurezza. La tua password rimarr\u00e0 invariata.\n\nCordiali saluti,\nIl team di {2}

# Execute Actions (generic action email)
# Arguments: {0} link, {2} product name, {3} expiry, {4} required actions
executeActionsSubject=Sei stato invitato a collaborare su documenti
executeActionsBody=Benvenuto su {2}!\n\nSei stato invitato a collaborare su documenti. Clicca sul link qui sotto per configurare il tuo account:\n\n{0}\n\nTi verr\u00e0 chiesto di verificare la tua email, completare il tuo profilo e scegliere una password.\n\nQuesto link scadr\u00e0 entro {3}.\n\nSe non ti aspettavi questo invito, puoi ignorare questa email in tutta sicurezza.\n\nCordiali saluti,\nIl team di {2}

