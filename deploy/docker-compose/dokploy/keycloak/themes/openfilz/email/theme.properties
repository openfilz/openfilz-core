parent=keycloak
locales=en,fr,de,ar,es,it,nl,pt
# Air-gapped site: "none" (no image is hot-linked, no link) or an intranet URL.
# Read from the container environment. Unset/empty = the hosted OpenFilz images and link while the
# realm's display name is OpenFilz; under another name, no image (the name is written out) and no link.
# A PNG address works for a brand logo (e-mail clients do not show SVG).
logoHeaderUrl=${env.OPENFILZ_MAIL_LOGO_URL:}
logoFooterUrl=${env.OPENFILZ_MAIL_FOOTER_LOGO_URL:}
brandUrl=${env.OPENFILZ_MAIL_BRAND_URL:}
